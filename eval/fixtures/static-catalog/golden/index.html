<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>春季产品目录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="a1b2c3_header"><div><span>Northstar Supply</span><h1>春季产品目录</h1></div><button class="a1b2c3_cart">购物袋 <b>2</b></button></header>
  <main>
    <div class="a1b2c3_toolbar"><p>精选办公与居家用品</p><select aria-label="排序"><option>推荐排序</option><option>价格从低到高</option></select></div>
    <section class="a1b2c3_catalogGrid" aria-label="产品列表">
      <article class="a1b2c3_productCard featured"><button class="a1b2c3_favorite" aria-label="收藏弧光台灯"><span aria-hidden="true">♡</span></button><div class="a1b2c3_art mint">A</div><h2>弧光台灯</h2><p>柔和漫反射，三档色温</p><strong class="a1b2c3_price">¥329</strong><button class="a1b2c3_action">加入购物袋</button></article>
      <article class="a1b2c3_productCard"><button class="a1b2c3_favorite" aria-label="收藏软木收纳盘"><span aria-hidden="true">♡</span></button><div class="a1b2c3_art sand">B</div><h2>软木收纳盘</h2><p>桌面小物分区整理</p><strong class="a1b2c3_price">¥128</strong><button class="a1b2c3_action">加入购物袋</button></article>
      <article class="a1b2c3_productCard sold-out"><button class="a1b2c3_favorite" aria-label="收藏折叠脚凳"><span aria-hidden="true">♡</span></button><div class="a1b2c3_art blue">C</div><h2>折叠脚凳</h2><p>轻量结构，随手收纳</p><strong class="a1b2c3_price">¥459</strong><button class="a1b2c3_action">到货提醒</button></article>
      <article class="a1b2c3_productCard"><button class="a1b2c3_favorite" aria-label="收藏羊毛桌垫"><span aria-hidden="true">♡</span></button><div class="a1b2c3_art rose">D</div><h2>羊毛桌垫</h2><p>保护桌面，触感温暖</p><strong class="a1b2c3_price">¥268</strong><button class="a1b2c3_action">加入购物袋</button></article>
    </section>
  </main>
</body>
</html>
