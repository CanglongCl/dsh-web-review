<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>魔法 UI 演示页</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #24292f; }
    .hero { background: linear-gradient(135deg, #4c6ef5, #7950f2); color: #fff; padding: 48px 24px; text-align: left; }
    .hero h1 { margin: 0 0 8px; font-size: 32px; }
    .hero p { margin: 0; opacity: 0.9; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; padding: 24px; max-width: 960px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); }
    .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    .card p { margin: 0 0 12px; font-size: 13px; color: #57606a; }
    .card button { border: 0; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .btn-primary { background: #224466; color: #fff; }
    .btn-ghost { background: #eef0f3; color: #24292f; }
    .card:nth-of-type(2) button.btn-ghost { background-color: #d7dbe0; }
    button.btn-primary { padding: 10px 24px; }
    .footer { text-align: center; padding: 24px; color: #8a8f98; font-size: 12px; }
  </style>
</head>
<body>
  <section class="hero">
    <h1>魔法 UI 演示页</h1>
    <p>用「预览」标签打开本页，选中元素并评论，让 AI 修改样式。</p>
  </section>
  <main class="cards">
    <div class="card">
      <h3>主按钮</h3>
      <p>用于提交表单的主要操作。</p>
      <button class="btn-primary">提交</button>
    </div>
    <div class="card">
      <h3>次要按钮</h3>
      <p>用于可逆的辅助操作。</p>
      <button class="btn-ghost">取消</button>
    </div>
    <div class="card">
      <h3>间距示例</h3>
      <p>卡片间距为 16px，可尝试调整到 24px。</p>
      <button class="btn-ghost">查看详情</button>
    </div>
  </main>
  <footer class="footer">dsh-web-review demo · 在独立 Preview Origin 中打开</footer>
</body>
</html>
