# Build the reviewed DSH bundle once, then publish those exact bytes from a
# protected job. The read token is confined to dependency installation; npm
# publication uses OIDC after the one-time package bootstrap.
name: Release (npm)

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.20.0'
  NPM_VERSION: '11.19.0'

jobs:
  pack:
    name: Verify and pack
    # Never expose repository secrets to code from an external fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      NPM_PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          scope: '@deepseek-ai'
          package-manager-cache: false

      - name: Verify toolchain
        working-directory: plugin
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install plugin dependencies
        working-directory: plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Verify release identity
        working-directory: plugin
        env:
          RELEASE_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm release:verify

      - name: Run npm-only quality gate
        working-directory: plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: pnpm check

      # Recreate the final artifact after all tests. The publish job downloads
      # this tarball and never rebuilds it.
      - name: Pack final npm artifact
        working-directory: plugin
        run: pnpm package:official

      - name: Verify artifact checksum
        working-directory: plugin/dist
        run: sha256sum -c SHA256SUMS

      - name: Upload npm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-web-review-npm
          path: |
            plugin/dist/*.tgz
            plugin/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_MODE == 'trusted'
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: dsh-web-review-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for npm OIDC
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Download packed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-web-review-npm
          path: release

      - name: Verify artifact identity
        id: artifact
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          package_file=$(awk 'NF == 2 { print $2 }' SHA256SUMS)
          test -n "$package_file"
          test "$(find . -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          test -f "$package_file"
          case "$package_file" in
            (*[!a-zA-Z0-9._-]*|'') exit 1 ;;
          esac
          tar -xOf "$package_file" package/package.json > "$RUNNER_TEMP/dsh-web-review-package.json"
          PACKAGE_FILE="$package_file" node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (manifest.name !== "@deepseek-ai/dsh-web-review") throw new Error(`unexpected package ${manifest.name}`);
            if (manifest.publishConfig?.access !== "restricted") throw new Error("package is not restricted");
            if (`refs/tags/v${manifest.version}` !== process.env.GITHUB_REF) throw new Error("tag/version mismatch");
            const tag = String(manifest.version).includes("-") ? "next" : "latest";
            const crypto = require("node:crypto");
            const tarball = `${process.env.GITHUB_WORKSPACE}/release/${process.env.PACKAGE_FILE}`;
            const integrity = `sha512-${crypto.createHash("sha512").update(fs.readFileSync(tarball)).digest("base64")}`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\ntag=${tag}\nidentity=${manifest.name}@${manifest.version}\nintegrity=${integrity}\n`);
          ' "$RUNNER_TEMP/dsh-web-review-package.json"

      - name: Check npm registry state
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
          PACKAGE_IDENTITY: ${{ steps.artifact.outputs.identity }}
          LOCAL_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        run: |
          set -euo pipefail
          set +e
          remote=$(npm view "$PACKAGE_IDENTITY" dist.integrity 2>&1)
          status=$?
          set -e
          if test "$status" = 0; then
            test "$remote" = "$LOCAL_INTEGRITY" || {
              echo "Registry version exists with different integrity" >&2
              exit 1
            }
            echo 'action=skip' >> "$GITHUB_OUTPUT"
          elif printf '%s' "$remote" | grep -Eq 'E404|404 Not Found'; then
            echo 'action=publish' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$remote" >&2
            exit "$status"
          fi

      # No registry credential is present: npm exchanges the GitHub OIDC token
      # under the package's exact Trusted Publisher configuration.
      - name: Publish with npm Trusted Publishing
        if: steps.registry.outputs.action == 'publish'
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --access restricted
          --tag "${{ steps.artifact.outputs.tag }}"

      - name: Report idempotent rerun
        if: steps.registry.outputs.action == 'skip'
        env:
          PACKAGE_IDENTITY: ${{ steps.artifact.outputs.identity }}
        run: echo "$PACKAGE_IDENTITY is already published with identical integrity."

  bootstrap_publish:
    name: Bootstrap first npm publication
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_MODE == 'bootstrap'
    needs: pack
    runs-on: ubuntu-24.04
    environment: npm-publish
    concurrency:
      group: dsh-web-review-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Set up Node.js for npm bootstrap
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install current npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Download packed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-web-review-npm
          path: release

      - name: Verify artifact identity
        id: artifact
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          package_file=$(awk 'NF == 2 { print $2 }' SHA256SUMS)
          test -n "$package_file"
          test "$(find . -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          test -f "$package_file"
          case "$package_file" in
            (*[!a-zA-Z0-9._-]*|'') exit 1 ;;
          esac
          tar -xOf "$package_file" package/package.json > "$RUNNER_TEMP/dsh-web-review-package.json"
          PACKAGE_FILE="$package_file" node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (manifest.name !== "@deepseek-ai/dsh-web-review") throw new Error(`unexpected package ${manifest.name}`);
            if (manifest.publishConfig?.access !== "restricted") throw new Error("package is not restricted");
            if (`refs/tags/v${manifest.version}` !== process.env.GITHUB_REF) throw new Error("tag/version mismatch");
            const tag = String(manifest.version).includes("-") ? "next" : "latest";
            const crypto = require("node:crypto");
            const tarball = `${process.env.GITHUB_WORKSPACE}/release/${process.env.PACKAGE_FILE}`;
            const integrity = `sha512-${crypto.createHash("sha512").update(fs.readFileSync(tarball)).digest("base64")}`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\ntag=${tag}\nidentity=${manifest.name}@${manifest.version}\nintegrity=${integrity}\n`);
          ' "$RUNNER_TEMP/dsh-web-review-package.json"

      - name: Check npm registry state
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
          PACKAGE_IDENTITY: ${{ steps.artifact.outputs.identity }}
          LOCAL_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        run: |
          set -euo pipefail
          set +e
          remote=$(npm view "$PACKAGE_IDENTITY" dist.integrity 2>&1)
          status=$?
          set -e
          if test "$status" = 0; then
            test "$remote" = "$LOCAL_INTEGRITY" || {
              echo "Registry version exists with different integrity" >&2
              exit 1
            }
            echo 'action=skip' >> "$GITHUB_OUTPUT"
          elif printf '%s' "$remote" | grep -Eq 'E404|404 Not Found'; then
            echo 'action=publish' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$remote" >&2
            exit "$status"
          fi

      # Set NPM_PUBLISH_MODE=bootstrap for exactly one run. After it succeeds,
      # configure npm Trusted Publishing, delete NPM_BOOTSTRAP_TOKEN, and set
      # the repository variable to trusted.
      - name: Bootstrap first npm publication
        if: steps.registry.outputs.action == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish "${{ steps.artifact.outputs.tarball }}" \
            --access restricted \
            --tag "${{ steps.artifact.outputs.tag }}"

      - name: Report idempotent rerun
        if: steps.registry.outputs.action == 'skip'
        env:
          PACKAGE_IDENTITY: ${{ steps.artifact.outputs.identity }}
        run: echo "$PACKAGE_IDENTITY is already published with identical integrity."
