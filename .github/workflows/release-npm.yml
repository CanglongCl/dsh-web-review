# Build the reviewed DSH bundle once, then publish those exact bytes to the
# public npm registry. Public dependencies install anonymously; only the
# publish job receives an npm credential.
name: Release (npm)

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.20.0'
  NPM_VERSION: '11.19.0'

jobs:
  pack:
    name: Verify and pack
    # Never expose repository secrets to code from an external fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          scope: '@deepseek-ai'
          package-manager-cache: false

      - name: Verify toolchain
        working-directory: plugin
        run: |
          node --version
          pnpm --version
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Verify release identity
        working-directory: plugin
        env:
          RELEASE_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm release:verify

      - name: Run npm-only quality gate
        working-directory: plugin
        run: pnpm check

      # Recreate the final artifact after all tests. The publish job downloads
      # this tarball and never rebuilds it.
      - name: Pack final npm artifact
        working-directory: plugin
        run: pnpm package:official

      - name: Verify artifact checksum
        working-directory: plugin/dist
        run: sha256sum -c SHA256SUMS

      - name: Upload npm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-web-review-npm
          path: |
            plugin/dist/*.tgz
            plugin/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-24.04
    concurrency:
      group: dsh-web-review-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Set up Node.js for npm publish
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install current npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Download packed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-web-review-npm
          path: release

      - name: Verify artifact identity
        id: artifact
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          package_file=$(awk 'NF == 2 { print $2 }' SHA256SUMS)
          test -n "$package_file"
          test "$(find . -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1
          test -f "$package_file"
          case "$package_file" in
            (*[!a-zA-Z0-9._-]*|'') exit 1 ;;
          esac
          tar -xOf "$package_file" package/package.json > "$RUNNER_TEMP/dsh-web-review-package.json"
          PACKAGE_FILE="$package_file" node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (manifest.name !== "@canglongcl/dsh-web-review") throw new Error(`unexpected package ${manifest.name}`);
            if (manifest.publishConfig?.access !== "public") throw new Error("package is not public");
            if (`refs/tags/v${manifest.version}` !== process.env.GITHUB_REF) throw new Error("tag/version mismatch");
            const tag = String(manifest.version).includes("-") ? "next" : "latest";
            const tarball = `${process.env.GITHUB_WORKSPACE}/release/${process.env.PACKAGE_FILE}`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\ntag=${tag}\n`);
          ' "$RUNNER_TEMP/dsh-web-review-package.json"

      - name: Publish public package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: >-
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --access public
          --tag "${{ steps.artifact.outputs.tag }}"
